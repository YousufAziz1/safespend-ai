name: CI Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-zeroclaw-plugin:
    name: ZeroClaw WebAssembly Verifications
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Cache Cargo Registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            zeroclaw-plugin/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-component
        run: cargo install cargo-component

      - name: Verify Formatting
        working-directory: ./zeroclaw-plugin
        run: cargo fmt --check

      - name: Execute Clippy Lints
        working-directory: ./zeroclaw-plugin
        run: cargo clippy --release

      - name: Execute Unit Tests
        working-directory: ./zeroclaw-plugin
        run: cargo test

      - name: Build WASM Component
        working-directory: ./zeroclaw-plugin
        run: cargo component build --release --target wasm32-wasip2

  build-nextjs-dashboard:
    name: Next.js Optional Dashboard Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install

      - name: ESLint Check
        run: pnpm lint

      - name: Build Dashboard
        run: pnpm build
